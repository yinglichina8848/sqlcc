<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Glowing 3D Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 50%, #000000 100%);
            min-height: 100vh;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">Move your mouse to rotate the sphere</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        // Post-processing for glow effect
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,  // strength
            0.4,  // radius
            0.85  // threshold
        );
        composer.addPass(bloomPass);

        // Create sphere with custom shader material for glow
        const sphereGeometry = new THREE.SphereGeometry(1.5, 64, 64);

        // Custom shader material for the glowing sphere
        const sphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: new THREE.Color(0x00ff88) },
                glowIntensity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUv;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                uniform float glowIntensity;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUv;

                void main() {
                    // Create animated glow pattern
                    float noise = sin(vPosition.x * 10.0 + time) * 
                                  cos(vPosition.y * 10.0 + time * 0.7) * 
                                  sin(vPosition.z * 10.0 + time * 0.5);
                    
                    // Fresnel effect for edge glow
                    vec3 viewDirection = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDirection, vNormal)), 2.0);
                    
                    // Base color with animated variation
                    vec3 baseColor = glowColor + vec3(0.1, 0.2, 0.3) * sin(time * 0.5);
                    
                    // Combine effects
                    float alpha = 0.3 + fresnel * 0.7 + noise * 0.1;
                    vec3 finalColor = baseColor * glowIntensity * (1.0 + fresnel * 0.5);
                    
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);

        // Inner core sphere (solid glow center)
        const coreGeometry = new THREE.SphereGeometry(1.3, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ff88,
            transparent: true,
            opacity: 0.6
        });
        const coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        sphere.add(coreSphere);

        // Outer glow sphere
        const outerGlowGeometry = new THREE.SphereGeometry(1.8, 32, 32);
        const outerGlowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: new THREE.Color(0x00ff88) }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                varying vec3 vNormal;

                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 glow = glowColor * intensity * (0.5 + 0.5 * sin(time));
                    gl_FragColor = vec4(glow, intensity * 0.5);
                }
            `,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const outerGlowSphere = new THREE.Mesh(outerGlowGeometry, outerGlowMaterial);
        sphere.add(outerGlowSphere);

        // Add point lights for additional illumination
        const pointLight1 = new THREE.PointLight(0x00ff88, 2, 10);
        pointLight1.position.set(2, 2, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x0088ff, 1, 10);
        pointLight2.position.set(-2, -2, 2);
        scene.add(pointLight2);

        const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
        scene.add(ambientLight);

        // Particle system for floating particles around the sphere
        const particleCount = 200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const radius = 3 + Math.random() * 2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i * 3 + 2] = radius * Math.cos(phi);

            particleSizes[i] = Math.random() * 2 + 0.5;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: new THREE.Color(0x00ff88) }
            },
            vertexShader: `
                attribute float size;
                uniform float time;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;
                    pos.x += sin(time * 0.5 + position.y) * 0.1;
                    pos.y += cos(time * 0.3 + position.x) * 0.1;
                    pos.z += sin(time * 0.7 + position.z) * 0.1;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = 0.5 + 0.5 * sin(time + position.x);
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vAlpha;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;

                    float alpha = (1.0 - dist * 2.0) * vAlpha;
                    gl_FragColor = vec4(color, alpha * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Mouse tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let currentRotationX = 0;
        let currentRotationY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) / window.innerWidth;
            mouseY = (event.clientY - window.innerHeight / 2) / window.innerHeight;

            targetRotationY = mouseX * Math.PI;
            targetRotationX = -mouseY * Math.PI;
        });

        // Touch support
        document.addEventListener('touchmove', (event) => {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - window.innerWidth / 2) / window.innerWidth;
                mouseY = (event.touches[0].clientY - window.innerHeight / 2) / window.innerHeight;

                targetRotationY = mouseX * Math.PI;
                targetRotationX = -mouseY * Math.PI;
            }
        });

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);

            time += 0.016;

            // Smooth rotation interpolation
            currentRotationX += (targetRotationX - currentRotationX) * 0.05;
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;

            // Apply rotation with some auto-spin
            sphere.rotation.x = currentRotationX + time * 0.1;
            sphere.rotation.y = currentRotationY + time * 0.15;

            // Update shader uniforms
            sphereMaterial.uniforms.time.value = time;
            outerGlowMaterial.uniforms.time.value = time;
            particleMaterial.uniforms.time.value = time;

            // Animate particles
            particles.rotation.y = time * 0.05;
            particles.rotation.x = time * 0.03;

            // Animate point lights
            pointLight1.position.x = Math.sin(time * 0.5) * 3;
            pointLight1.position.z = Math.cos(time * 0.5) * 3;
            pointLight2.position.x = Math.cos(time * 0.3) * 3;
            pointLight2.position.z = Math.sin(time * 0.3) * 3;

            // Render with post-processing
            composer.render();
        }

        animate();
    </script>
</body>
</html>
