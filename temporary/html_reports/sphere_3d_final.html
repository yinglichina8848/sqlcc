<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glowing Sphere - Final</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 50%, #000000 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        .cursor-default { cursor: default; }
        .cursor-orbit { cursor: move; }
        .cursor-pan { cursor: grabbing; }

        /* 控制面板 */
        #controls-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 13px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 220px;
        }

        #controls-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #00ff88;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        #controls-panel .control-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            gap: 12px;
        }

        #controls-panel .key {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            min-width: 80px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }

        #controls-panel .key.active {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        #controls-panel .action {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 状态面板 */
        #status-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 180px;
        }

        #status-panel h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #00ff88;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        #status-panel .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            align-items: center;
        }

        #status-panel .stat-label {
            color: rgba(255, 255, 255, 0.6);
        }

        #status-panel .stat-value {
            color: #00ff88;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        #status-panel .color-preview {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 颜色提示 */
        #color-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        #color-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #color-toast .color-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 40px currentColor, 0 0 80px currentColor, inset 0 0 20px rgba(255,255,255,0.3);
            animation: pulse 1s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #color-toast .color-text {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 25px;
            letter-spacing: 2px;
        }

        /* 底部帮助 */
        #help-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .help-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }

        .help-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.orbit { background: #ff6b6b; }
        .dot.pan { background: #4ecdc4; }
        .dot.zoom { background: #ffe66d; }
        .dot.color { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .dot.reset { background: #95e1d3; }

        /* 重置按钮 */
        #reset-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            font-weight: bold;
        }

        #reset-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #reset-btn:hover {
            background: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- 控制面板 -->
    <div id="controls-panel">
        <h3>🎮 3D 控制器</h3>
        <div class="control-item">
            <span class="key" id="key-lmb">🖱️ 左键</span>
            <span class="action">旋转球体</span>
        </div>
        <div class="control-item">
            <span class="key" id="key-rmb">🖱️ 右键</span>
            <span class="action">平移位置</span>
        </div>
        <div class="control-item">
            <span class="key" id="key-wheel">🎡 滚轮</span>
            <span class="action">缩放距离</span>
        </div>
        <div class="control-item">
            <span class="key" id="key-color">⌨️ C+滚轮</span>
            <span class="action">改变颜色</span>
        </div>
    </div>

    <!-- 状态面板 -->
    <div id="status-panel">
        <h3>📊 状态</h3>
        <div class="stat-row">
            <span class="stat-label">颜色:</span>
            <span class="stat-value" id="color-value">
                #00FF88<span class="color-preview" id="color-dot" style="background: #00ff88;"></span>
            </span>
        </div>
        <div class="stat-row">
            <span class="stat-label">距离:</span>
            <span class="stat-value" id="dist-value">5.00</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">发光强度:</span>
            <span class="stat-value" id="glow-value">100%</span>
        </div>
    </div>

    <!-- 颜色提示 -->
    <div id="color-toast">
        <div class="color-circle" id="color-circle" style="background: #00ff88; color: #00ff88;"></div>
        <div class="color-text" id="color-text">#00FF88</div>
    </div>

    <!-- 底部帮助 -->
    <div id="help-bar">
        <div class="help-item">
            <span class="dot orbit"></span>
            <span>左键旋转</span>
        </div>
        <div class="help-item">
            <span class="dot pan"></span>
            <span>右键平移</span>
        </div>
        <div class="help-item">
            <span class="dot zoom"></span>
            <span>滚轮缩放</span>
        </div>
        <div class="help-item">
            <span class="dot color"></span>
            <span>C+滚轮变色</span>
        </div>
        <div class="help-item">
            <span class="dot reset"></span>
            <span>双击重置</span>
        </div>
    </div>

    <!-- 重置按钮 -->
    <button id="reset-btn">↺ 重置视角与颜色</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ============================================
        // 配置
        // ============================================
        const CONFIG = {
            MIN_DIST: 3,
            MAX_DIST: 15,
            ZOOM_SPEED: 0.05,
            ROTATE_SPEED: 2.0,
            PAN_SPEED: 0.02,
            COLOR_SPEED: 0.003,
            DAMPING: 0.08
        };

        // ============================================
        // 状态
        // ============================================
        const state = {
            hue: 0.44,  // 青绿色
            distance: 5,
            targetDist: 5,
            pos: { x: 0, y: 0 },
            targetPos: { x: 0, y: 0 },
            rot: { x: 0, y: 0 },
            targetRot: { x: 0, y: 0 },
            mode: 'none',  // none, rotate, pan
            isColorMode: false
        };

        // ============================================
        // 场景设置
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 添加雾化效果
        scene.fog = new THREE.FogExp2(0x0f0f1a, 0.03);
        scene.background = new THREE.Color(0x0f0f1a);

        // 相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = state.distance;

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 后处理
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.8,  // strength
            0.5,  // radius
            0.8   // threshold
        );
        composer.addPass(bloomPass);

        // ============================================
        // 颜色工具
        // ============================================
        function getColor() {
            const c = new THREE.Color();
            c.setHSL(state.hue, 1.0, 0.5);
            return c;
        }

        function getHex(color) {
            const r = Math.round(color.r * 255).toString(16).padStart(2, '0');
            const g = Math.round(color.g * 255).toString(16).padStart(2, '0');
            const b = Math.round(color.b * 255).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`.toUpperCase();
        }

        function updateColorUI() {
            const color = getColor();
            const hex = getHex(color);
            
            document.getElementById('color-value').innerHTML = 
                `${hex}<span class="color-preview" style="background: ${hex.toLowerCase()};"></span>`;
            
            // 显示提示
            const toast = document.getElementById('color-toast');
            const circle = document.getElementById('color-circle');
            const text = document.getElementById('color-text');
            
            circle.style.backgroundColor = hex;
            circle.style.color = hex;
            circle.style.boxShadow = `0 0 40px ${hex}, 0 0 80px ${hex}`;
            text.textContent = hex;
            
            toast.classList.add('show');
            clearTimeout(window.colorTimeout);
            window.colorTimeout = setTimeout(() => toast.classList.remove('show'), 1200);
        }

        // ============================================
        // 创建球体 - 最初的发光效果
        // ============================================
        const sphereGroup = new THREE.Group();
        scene.add(sphereGroup);

        // 主发光球体 - ShaderMaterial
        const sphereGeo = new THREE.SphereGeometry(1.5, 64, 64);
        const sphereMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: getColor() },
                glowIntensity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                uniform float glowIntensity;

                varying vec3 vNormal;
                varying vec3 vPosition;

                void main() {
                    // 动态波纹噪声
                    float noise = sin(vPosition.x * 10.0 + time) * 
                                  cos(vPosition.y * 10.0 + time * 0.7) * 
                                  sin(vPosition.z * 10.0 + time * 0.5);
                    
                    // Fresnel 边缘发光
                    vec3 viewDir = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.0);
                    
                    // 基础颜色 + 动画
                    vec3 baseColor = glowColor + vec3(0.1, 0.2, 0.3) * sin(time * 0.5);
                    
                    // 合成
                    float alpha = 0.3 + fresnel * 0.7 + noise * 0.1;
                    vec3 finalColor = baseColor * glowIntensity * (1.0 + fresnel * 0.5);
                    
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });

        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphereGroup.add(sphere);

        // 内核 - 实心发光
        const coreGeo = new THREE.SphereGeometry(1.3, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({
            color: getColor(),
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const coreSphere = new THREE.Mesh(coreGeo, coreMat);
        sphere.add(coreSphere);

        // 外层光晕
        const outerGeo = new THREE.SphereGeometry(1.9, 32, 32);
        const outerMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: getColor() }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                varying vec3 vNormal;

                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 glow = glowColor * intensity * (0.5 + 0.5 * sin(time));
                    gl_FragColor = vec4(glow, intensity * 0.6);
                }
            `,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const outerSphere = new THREE.Mesh(outerGeo, outerMat);
        sphere.add(outerSphere);

        // 粒子系统
        const particleCount = 200;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const r = 3 + Math.random() * 2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            pPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            pPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pPos[i * 3 + 2] = r * Math.cos(phi);
            pSizes[i] = Math.random() * 2 + 0.5;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));

        const pMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: getColor() }
            },
            vertexShader: `
                attribute float size;
                uniform float time;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;
                    pos.x += sin(time * 0.5 + position.y) * 0.1;
                    pos.y += cos(time * 0.3 + position.x) * 0.1;
                    pos.z += sin(time * 0.7 + position.z) * 0.1;

                    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (300.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                    vAlpha = 0.5 + 0.5 * sin(time + position.x);
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vAlpha;

                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    float a = (1.0 - d * 2.0) * vAlpha;
                    gl_FragColor = vec4(color, a * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(pGeo, pMat);
        sphereGroup.add(particles);

        // 灯光
        const pLight1 = new THREE.PointLight(getColor(), 2, 10);
        pLight1.position.set(2, 2, 2);
        scene.add(pLight1);

        const pLight2 = new THREE.PointLight(0x0088ff, 1, 10);
        pLight2.position.set(-2, -2, 2);
        scene.add(pLight2);

        const aLight = new THREE.AmbientLight(0x111122, 0.4);
        scene.add(aLight);

        // ============================================
        // 更新所有颜色
        // ============================================
        function updateAllColors() {
            const c = getColor();
            sphereMat.uniforms.glowColor.value = c;
            outerMat.uniforms.glowColor.value = c;
            pMat.uniforms.color.value = c;
            coreMat.color = c;
            pLight1.color = c;
        }

        // ============================================
        // 交互控制
        // ============================================
        const canvas = renderer.domElement;
        let lastMouse = { x: 0, y: 0 };

        // 阻止右键菜单
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // 鼠标按下
        canvas.addEventListener('mousedown', e => {
            lastMouse = { x: e.clientX, y: e.clientY };
            
            if (e.button === 0) {
                state.mode = 'rotate';
            } else if (e.button === 2) {
                state.mode = 'pan';
            }
            
            updateCursor();
            updateKeyHighlight();
        });

        // 鼠标移动
        document.addEventListener('mousemove', e => {
            if (state.mode === 'none') return;
            
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            lastMouse = { x: e.clientX, y: e.clientY };
            
            if (state.mode === 'rotate') {
                state.targetRot.y += dx * 0.01 * CONFIG.ROTATE_SPEED;
                state.targetRot.x += dy * 0.01 * CONFIG.ROTATE_SPEED;
            } else if (state.mode === 'pan') {
                state.targetPos.x += dx * CONFIG.PAN_SPEED;
                state.targetPos.y -= dy * CONFIG.PAN_SPEED;
            }
        });

        // 鼠标释放
        document.addEventListener('mouseup', () => {
            state.mode = 'none';
            updateCursor();
            updateKeyHighlight();
        });

        // 滚轮 - 缩放或变色
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            
            if (state.isColorMode) {
                // 改变颜色
                state.hue += e.deltaY * CONFIG.COLOR_SPEED;
                state.hue = ((state.hue % 1) + 1) % 1;
                updateAllColors();
                updateColorUI();
            } else {
                // 缩放
                state.targetDist += e.deltaY * 0.01;
                state.targetDist = Math.max(CONFIG.MIN_DIST, Math.min(CONFIG.MAX_DIST, state.targetDist));
            }
        }, { passive: false });

        // 键盘 - C键颜色模式
        document.addEventListener('keydown', e => {
            if (e.key === 'c' || e.key === 'C') {
                state.isColorMode = true;
                canvas.style.cursor = 'ew-resize';
                document.getElementById('key-color').classList.add('active');
            }
        });

        document.addEventListener('keyup', e => {
            if (e.key === 'c' || e.key === 'C') {
                state.isColorMode = false;
                updateCursor();
                document.getElementById('key-color').classList.remove('active');
            }
        });

        // 双击重置
        document.addEventListener('dblclick', () => {
            state.hue = 0.44;
            state.targetDist = 5;
            state.targetPos = { x: 0, y: 0 };
            state.targetRot = { x: 0, y: 0 };
            updateAllColors();
            updateColorUI();
        });

        // 重置按钮
        document.getElementById('reset-btn').addEventListener('click', () => {
            state.hue = 0.44;
            state.targetDist = 5;
            state.targetPos = { x: 0, y: 0 };
            state.targetRot = { x: 0, y: 0 };
            updateAllColors();
            updateColorUI();
        });

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI更新
        function updateCursor() {
            if (state.isColorMode) {
                canvas.style.cursor = 'ew-resize';
                return;
            }
            canvas.className = state.mode === 'rotate' ? 'cursor-orbit' : 
                              state.mode === 'pan' ? 'cursor-pan' : 'cursor-default';
        }

        function updateKeyHighlight() {
            document.getElementById('key-lmb').classList.toggle('active', state.mode === 'rotate');
            document.getElementById('key-rmb').classList.toggle('active', state.mode === 'pan');
        }

        function updateStatus() {
            state.distance += (state.targetDist - state.distance) * CONFIG.DAMPING;
            state.pos.x += (state.targetPos.x - state.pos.x) * CONFIG.DAMPING;
            state.pos.y += (state.targetPos.y - state.pos.y) * CONFIG.DAMPING;
            state.rot.x += (state.targetRot.x - state.rot.x) * CONFIG.DAMPING;
            state.rot.y += (state.targetRot.y - state.rot.y) * CONFIG.DAMPING;
            
            // 更新相机
            camera.position.z = state.distance;
            camera.position.x = state.pos.x;
            camera.position.y = state.pos.y;
            camera.lookAt(state.pos.x, state.pos.y, 0);
            
            // 更新UI
            document.getElementById('dist-value').textContent = state.distance.toFixed(2);
            
            // 显示重置按钮
            const changed = Math.abs(state.distance - 5) > 0.1 || 
                          Math.abs(state.pos.x) > 0.1 || 
                          Math.abs(state.pos.y) > 0.1 ||
                          Math.abs(state.hue - 0.44) > 0.01;
            document.getElementById('reset-btn').classList.toggle('visible', changed);
        }

        // ============================================
        // 动画循环
        // ============================================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.016;
            
            // 更新shader时间
            sphereMat.uniforms.time.value = time;
            outerMat.uniforms.time.value = time;
            pMat.uniforms.time.value = time;
            
            // 球体旋转
            sphere.rotation.y = state.rot.y + time * 0.1;
            sphere.rotation.x = state.rot.x + Math.sin(time * 0.2) * 0.1;
            
            // 粒子旋转
            particles.rotation.y = time * 0.05;
            particles.rotation.x = time * 0.03;
            
            // 灯光动画
            pLight1.position.x = state.pos.x + Math.sin(time * 0.5) * 3;
            pLight1.position.z = Math.cos(time * 0.5) * 3;
            pLight2.position.x = state.pos.x + Math.cos(time * 0.3) * 3;
            pLight2.position.z = Math.sin(time * 0.3) * 3;
            
            updateStatus();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
