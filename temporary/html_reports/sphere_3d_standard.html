<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sphere - Standard Controls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 50%, #000000 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* 光标状态 */
        .cursor-default { cursor: default; }
        .cursor-orbit { cursor: move; }
        .cursor-pan { cursor: grabbing; }
        .cursor-zoom { cursor: ns-resize; }

        /* 控制提示面板 */
        #controls-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 13px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 240px;
        }

        #controls-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #00ff88;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #controls-panel .control-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            gap: 12px;
        }

        #controls-panel .key {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            min-width: 90px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #controls-panel .key.active {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
            color: #00ff88;
        }

        #controls-panel .action {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 状态面板 */
        #status-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }

        #status-panel h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #00ff88;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        #status-panel .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            align-items: center;
        }

        #status-panel .stat-label {
            color: rgba(255, 255, 255, 0.6);
        }

        #status-panel .stat-value {
            color: #00ff88;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        #status-panel .mode-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: #666;
        }

        #status-panel .mode-indicator.active {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        #status-panel .color-preview {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 颜色提示 */
        #color-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        #color-indicator.show {
            opacity: 1;
        }

        #color-indicator .color-wheel {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
        }

        #color-indicator .color-label {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 底部帮助 */
        #help-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .help-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .help-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.orbit { background: #ff6b6b; }
        .dot.pan { background: #4ecdc4; }
        .dot.zoom { background: #ffe66d; }
        .dot.color { background: #00ff88; }
        .dot.reset { background: #95e1d3; }

        /* 重置按钮 */
        #reset-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        #reset-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #reset-btn:hover {
            background: rgba(0, 255, 136, 0.3);
        }

        /* 轴指示器 */
        #axis-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- 控制说明面板 -->
    <div id="controls-panel">
        <h3>🎮 标准3D控制</h3>
        <div class="control-item">
            <span class="key" id="key-lmb">LMB</span>
            <span class="action">旋转视角 (Orbit)</span>
        </div>
        <div class="control-item">
            <span class="key" id="key-rmb">RMB</span>
            <span class="action">平移视角 (Pan)</span>
        </div>
        <div class="control-item">
            <span class="key" id="key-wheel">Wheel</span>
            <span class="action">缩放视角 (Zoom)</span>
        </div>
        <div class="control-item">
            <span class="key" id="key-color">C+Wheel</span>
            <span class="action">改变颜色 (Color)</span>
        </div>
        <div class="control-item">
            <span class="key">Shift+LMB</span>
            <span class="action">平移 (替代)</span>
        </div>
    </div>

    <!-- 状态面板 -->
    <div id="status-panel">
        <h3>📊 当前状态</h3>
        <div class="stat-row">
            <span class="stat-label">当前模式:</span>
            <span class="stat-value" id="current-mode">
                <span class="mode-indicator" id="mode-dot"></span>
                <span id="mode-text">空闲</span>
            </span>
        </div>
        <div class="stat-row">
            <span class="stat-label">颜色:</span>
            <span class="stat-value" id="color-value">
                #00FF88<span class="color-preview" style="background: #00ff88;"></span>
            </span>
        </div>
        <div class="stat-row">
            <span class="stat-label">距离:</span>
            <span class="stat-value" id="distance-value">5.00</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">水平角:</span>
            <span class="stat-value" id="azimuth-value">0°</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">垂直角:</span>
            <span class="stat-value" id="polar-value">90°</span>
        </div>
    </div>

    <!-- 颜色变化提示 -->
    <div id="color-indicator">
        <div class="color-wheel" id="color-wheel" style="background: #00ff88; color: #00ff88;"></div>
        <span class="color-label" id="color-label">#00FF88</span>
    </div>

    <!-- 底部帮助栏 -->
    <div id="help-bar">
        <div class="help-item">
            <span class="dot orbit"></span>
            <span>左键旋转</span>
        </div>
        <div class="help-item">
            <span class="dot pan"></span>
            <span>右键平移</span>
        </div>
        <div class="help-item">
            <span class="dot zoom"></span>
            <span>滚轮缩放</span>
        </div>
        <div class="help-item">
            <span class="dot color"></span>
            <span>C+滚轮变色</span>
        </div>
        <div class="help-item">
            <span class="dot reset"></span>
            <span>双击重置</span>
        </div>
    </div>

    <!-- 重置按钮 -->
    <button id="reset-btn">↺ 重置视角</button>

    <!-- 轴指示器 Canvas -->
    <canvas id="axis-indicator"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ============================================
        // 配置常量
        // ============================================
        const CONFIG = {
            INITIAL_DISTANCE: 5,
            MIN_DISTANCE: 2,
            MAX_DISTANCE: 20,
            ZOOM_SPEED: 0.001,
            ROTATE_SPEED: 1.0,
            PAN_SPEED: 0.01,
            COLOR_CHANGE_SPEED: 0.002,
            ENABLE_DAMPING: true,
            DAMPING_FACTOR: 0.05
        };

        // 控制模式枚举
        const ControlMode = {
            NONE: 'none',
            ORBIT: 'orbit',
            PAN: 'pan',
            ZOOM: 'zoom'
        };

        // ============================================
        // 场景初始化
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        // 渲染器
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        // 后处理 - 发光效果
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,  // strength
            0.4,  // radius
            0.85  // threshold
        );
        composer.addPass(bloomPass);

        // ============================================
        // 颜色管理
        // ============================================
        const colorState = {
            hue: 0.44,  // 初始青色/绿色
            saturation: 1.0,
            lightness: 0.5
        };

        function hslToHex(h, s, l) {
            const color = new THREE.Color();
            color.setHSL(h, s, l);
            return color;
        }

        function getColorHexString(color) {
            const r = Math.round(color.r * 255).toString(16).padStart(2, '0');
            const g = Math.round(color.g * 255).toString(16).padStart(2, '0');
            const b = Math.round(color.b * 255).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`.toUpperCase();
        }

        function updateColorIndicator(color) {
            const indicator = document.getElementById('color-indicator');
            const wheel = document.getElementById('color-wheel');
            const hex = getColorHexString(color);
            
            wheel.style.backgroundColor = hex;
            wheel.style.color = hex;
            document.getElementById('color-label').textContent = hex;
            
            indicator.classList.add('show');
            setTimeout(() => indicator.classList.remove('show'), 1500);
        }

        // ============================================
        // 创建球体和发光效果
        // ============================================
        const sphereGroup = new THREE.Group();
        scene.add(sphereGroup);

        // 主球体 - 使用自定义Shader实现发光动画
        const sphereGeometry = new THREE.SphereGeometry(1.5, 64, 64);
        const sphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: hslToHex(colorState.hue, colorState.saturation, colorState.lightness) },
                glowIntensity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUv;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                uniform float glowIntensity;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUv;

                void main() {
                    // 创建动画发光图案
                    float noise = sin(vPosition.x * 10.0 + time) * 
                                  cos(vPosition.y * 10.0 + time * 0.7) * 
                                  sin(vPosition.z * 10.0 + time * 0.5);
                    
                    // Fresnel effect for edge glow
                    vec3 viewDirection = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDirection, vNormal)), 2.0);
                    
                    // Base color with animated variation
                    vec3 baseColor = glowColor + vec3(0.1, 0.2, 0.3) * sin(time * 0.5);
                    
                    // Combine effects
                    float alpha = 0.3 + fresnel * 0.7 + noise * 0.1;
                    vec3 finalColor = baseColor * glowIntensity * (1.0 + fresnel * 0.5);
                    
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });

        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphereGroup.add(sphere);

        // 内核球体 - 实心发光核心
        const coreGeometry = new THREE.SphereGeometry(1.3, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: hslToHex(colorState.hue, colorState.saturation, colorState.lightness),
            transparent: true,
            opacity: 0.6
        });
        const coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        sphere.add(coreSphere);

        // 外层光晕球
        const outerGlowGeometry = new THREE.SphereGeometry(1.8, 32, 32);
        const outerGlowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: hslToHex(colorState.hue, colorState.saturation, colorState.lightness) }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                varying vec3 vNormal;

                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 glow = glowColor * intensity * (0.5 + 0.5 * sin(time));
                    gl_FragColor = vec4(glow, intensity * 0.5);
                }
            `,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const outerGlowSphere = new THREE.Mesh(outerGlowGeometry, outerGlowMaterial);
        sphere.add(outerGlowSphere);

        // 网格地面
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        gridHelper.position.y = -3;
        scene.add(gridHelper);

        // 坐标轴辅助
        const axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);

        // 粒子系统 - 使用与球体相同的颜色
        const particleCount = 200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const radius = 3 + Math.random() * 2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i * 3 + 2] = radius * Math.cos(phi);

            particleSizes[i] = Math.random() * 2 + 0.5;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: hslToHex(colorState.hue, colorState.saturation, colorState.lightness) }
            },
            vertexShader: `
                attribute float size;
                uniform float time;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;
                    pos.x += sin(time * 0.5 + position.y) * 0.1;
                    pos.y += cos(time * 0.3 + position.x) * 0.1;
                    pos.z += sin(time * 0.7 + position.z) * 0.1;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = 0.5 + 0.5 * sin(time + position.x);
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vAlpha;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;

                    float alpha = (1.0 - dist * 2.0) * vAlpha;
                    gl_FragColor = vec4(color, alpha * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        sphereGroup.add(particles);

        // 灯光 - 使用与球体相同的颜色
        const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(
            hslToHex(colorState.hue, colorState.saturation, colorState.lightness), 
            2, 10
        );
        pointLight1.position.set(2, 2, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x0088ff, 1, 10);
        pointLight2.position.set(-2, -2, 2);
        scene.add(pointLight2);

        // ============================================
        // 更新所有颜色的统一函数
        // ============================================
        function updateAllColors() {
            const newColor = hslToHex(colorState.hue, colorState.saturation, colorState.lightness);
            
            // 更新所有材质的颜色
            sphereMaterial.uniforms.glowColor.value = newColor;
            outerGlowMaterial.uniforms.glowColor.value = newColor;
            particleMaterial.uniforms.color.value = newColor;
            coreMaterial.color = newColor;
            pointLight1.color = newColor;
            
            // 更新UI
            const hexString = getColorHexString(newColor);
            document.getElementById('color-value').innerHTML = 
                `${hexString}<span class="color-preview" style="background: ${hexString.toLowerCase()};"></span>`;
        }

        // ============================================
        // 轨道控制器
        // ============================================
        class StandardOrbitControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                
                this.target = new THREE.Vector3(0, 0, 0);
                this.spherical = new THREE.Spherical();
                this.sphericalDelta = new THREE.Spherical();
                this.scale = 1;
                this.zoomDelta = 0;
                this.panOffset = new THREE.Vector3();
                
                this.mode = ControlMode.NONE;
                this.mouse = new THREE.Vector2();
                this.mousePrevious = new THREE.Vector2();
                
                this.enableDamping = CONFIG.ENABLE_DAMPING;
                this.dampingFactor = CONFIG.DAMPING_FACTOR;
                
                // 颜色控制状态
                this.isColorMode = false;
                
                this.init();
                this.update();
            }

            init() {
                this.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
                this.domElement.addEventListener('mousedown', this.onMouseDown.bind(this));
                document.addEventListener('mousemove', this.onMouseMove.bind(this));
                document.addEventListener('mouseup', this.onMouseUp.bind(this));
                this.domElement.addEventListener('wheel', this.onWheel.bind(this), { passive: false });
                
                // 键盘事件用于颜色控制
                document.addEventListener('keydown', this.onKeyDown.bind(this));
                document.addEventListener('keyup', this.onKeyUp.bind(this));
            }

            onKeyDown(event) {
                if (event.key === 'c' || event.key === 'C') {
                    this.isColorMode = true;
                    document.getElementById('key-color').classList.add('active');
                    this.domElement.style.cursor = 'ew-resize';
                }
            }

            onKeyUp(event) {
                if (event.key === 'c' || event.key === 'C') {
                    this.isColorMode = false;
                    document.getElementById('key-color').classList.remove('active');
                    this.updateCursor();
                }
            }

            onMouseDown(event) {
                event.preventDefault();
                this.mousePrevious.set(event.clientX, event.clientY);
                
                if (event.button === 0) {
                    if (event.shiftKey) {
                        this.mode = ControlMode.PAN;
                    } else {
                        this.mode = ControlMode.ORBIT;
                    }
                } else if (event.button === 2) {
                    this.mode = ControlMode.PAN;
                } else if (event.button === 1) {
                    this.mode = ControlMode.ZOOM;
                }
                
                this.updateCursor();
                this.updateUI();
            }

            onMouseMove(event) {
                this.mouse.set(event.clientX, event.clientY);
                
                if (this.mode === ControlMode.NONE) return;
                
                const deltaX = this.mouse.x - this.mousePrevious.x;
                const deltaY = this.mouse.y - this.mousePrevious.y;
                
                if (this.mode === ControlMode.ORBIT) {
                    this.sphericalDelta.theta -= 2 * Math.PI * deltaX / this.domElement.clientHeight * CONFIG.ROTATE_SPEED;
                    this.sphericalDelta.phi -= 2 * Math.PI * deltaY / this.domElement.clientHeight * CONFIG.ROTATE_SPEED;
                } else if (this.mode === ControlMode.PAN) {
                    this.pan(deltaX * CONFIG.PAN_SPEED, deltaY * CONFIG.PAN_SPEED);
                } else if (this.mode === ControlMode.ZOOM) {
                    this.zoomDelta -= deltaY * 0.01;
                }
                
                this.mousePrevious.copy(this.mouse);
            }

            onMouseUp() {
                this.mode = ControlMode.NONE;
                this.updateCursor();
                this.updateUI();
            }

            onWheel(event) {
                event.preventDefault();
                
                if (this.isColorMode) {
                    // 改变颜色模式
                    colorState.hue += event.deltaY * CONFIG.COLOR_CHANGE_SPEED;
                    colorState.hue = colorState.hue % 1;
                    if (colorState.hue < 0) colorState.hue += 1;
                    
                    updateAllColors();
                    updateColorIndicator(hslToHex(colorState.hue, colorState.saturation, colorState.lightness));
                } else {
                    // 缩放模式
                    if (event.deltaY < 0) {
                        this.zoomDelta -= CONFIG.ZOOM_SPEED * 100;
                    } else {
                        this.zoomDelta += CONFIG.ZOOM_SPEED * 100;
                    }
                }
            }

            pan(deltaX, deltaY) {
                const offset = new THREE.Vector3();
                offset.copy(this.camera.position).sub(this.target);
                
                let targetDistance = offset.length();
                targetDistance *= Math.tan((this.camera.fov / 2) * Math.PI / 180.0);
                
                const panLeft = new THREE.Vector3();
                panLeft.setFromMatrixColumn(this.camera.matrix, 0);
                panLeft.multiplyScalar(-2 * deltaX * targetDistance / this.domElement.clientHeight);
                
                const panUp = new THREE.Vector3();
                panUp.setFromMatrixColumn(this.camera.matrix, 1);
                panUp.multiplyScalar(2 * deltaY * targetDistance / this.domElement.clientHeight);
                
                this.panOffset.add(panLeft).add(panUp);
            }

            update() {
                const offset = new THREE.Vector3();
                offset.copy(this.camera.position).sub(this.target);
                
                this.spherical.setFromVector3(offset);
                
                this.spherical.theta += this.sphericalDelta.theta;
                this.spherical.phi += this.sphericalDelta.phi;
                this.spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this.spherical.phi));
                
                this.spherical.radius *= 1 + this.zoomDelta;
                this.spherical.radius = Math.max(CONFIG.MIN_DISTANCE, 
                    Math.min(CONFIG.MAX_DISTANCE, this.spherical.radius));
                
                this.target.add(this.panOffset);
                
                offset.setFromSpherical(this.spherical);
                this.camera.position.copy(this.target).add(offset);
                this.camera.lookAt(this.target);
                
                if (this.enableDamping) {
                    this.sphericalDelta.theta *= (1 - this.dampingFactor);
                    this.sphericalDelta.phi *= (1 - this.dampingFactor);
                    this.zoomDelta *= (1 - this.dampingFactor);
                    this.panOffset.multiplyScalar(1 - this.dampingFactor);
                }
                
                return true;
            }

            updateCursor() {
                if (this.isColorMode) {
                    this.domElement.style.cursor = 'ew-resize';
                    return;
                }
                this.domElement.className = '';
                switch (this.mode) {
                    case ControlMode.ORBIT:
                        this.domElement.classList.add('cursor-orbit');
                        break;
                    case ControlMode.PAN:
                        this.domElement.classList.add('cursor-pan');
                        break;
                    case ControlMode.ZOOM:
                        this.domElement.classList.add('cursor-zoom');
                        break;
                    default:
                        this.domElement.classList.add('cursor-default');
                }
            }

            updateUI() {
                const modeNames = {
                    [ControlMode.NONE]: '空闲',
                    [ControlMode.ORBIT]: '旋转',
                    [ControlMode.PAN]: '平移',
                    [ControlMode.ZOOM]: '缩放'
                };
                
                document.getElementById('mode-text').textContent = modeNames[this.mode];
                document.getElementById('mode-dot').classList.toggle('active', this.mode !== ControlMode.NONE);
                
                document.getElementById('key-lmb').classList.toggle('active', 
                    this.mode === ControlMode.ORBIT);
                document.getElementById('key-rmb').classList.toggle('active', 
                    this.mode === ControlMode.PAN);
                document.getElementById('key-wheel').classList.toggle('active', 
                    this.mode === ControlMode.ZOOM);
            }

            reset() {
                this.target.set(0, 0, 0);
                this.spherical.set(CONFIG.INITIAL_DISTANCE, Math.PI / 2, 0);
                this.sphericalDelta.set(0, 0, 0);
                this.panOffset.set(0, 0, 0);
                this.zoomDelta = 0;
                this.update();
                
                // 重置颜色
                colorState.hue = 0.44;
                updateAllColors();
                updateColorIndicator(hslToHex(colorState.hue, colorState.saturation, colorState.lightness));
            }

            getStatus() {
                return {
                    distance: this.spherical.radius,
                    azimuth: (this.spherical.theta * 180 / Math.PI) % 360,
                    polar: (this.spherical.phi * 180 / Math.PI)
                };
            }
        }

        // ============================================
        // 初始化控制器
        // ============================================
        const controls = new StandardOrbitControls(camera, renderer.domElement);

        // ============================================
        // 轴指示器
        // ============================================
        function drawAxisIndicator() {
            const canvas = document.getElementById('axis-indicator');
            const ctx = canvas.getContext('2d');
            canvas.width = 80;
            canvas.height = 80;

            function render() {
                ctx.clearRect(0, 0, 80, 80);
                
                const centerX = 40;
                const centerY = 40;
                const length = 25;

                const rotation = new THREE.Euler().setFromRotationMatrix(camera.matrixWorld);
                const cosY = Math.cos(rotation.y);
                const sinY = Math.sin(rotation.y);
                const cosX = Math.cos(rotation.x);

                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + length * cosY, centerY - length * sinY * cosX);
                ctx.stroke();
                ctx.fillStyle = '#ff4444';
                ctx.fillText('X', centerX + length * cosY + 5, centerY - length * sinY * cosX);

                ctx.strokeStyle = '#44ff44';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX, centerY - length);
                ctx.stroke();
                ctx.fillStyle = '#44ff44';
                ctx.fillText('Y', centerX + 5, centerY - length - 5);

                ctx.strokeStyle = '#4444ff';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX - length * sinY, centerY - length * cosY * cosX);
                ctx.stroke();
                ctx.fillStyle = '#4444ff';
                ctx.fillText('Z', centerX - length * sinY - 10, centerY - length * cosY * cosX);

                requestAnimationFrame(render);
            }
            render();
        }
        drawAxisIndicator();

        // ============================================
        // 状态更新
        // ============================================
        function updateStatus() {
            const status = controls.getStatus();
            document.getElementById('distance-value').textContent = status.distance.toFixed(2);
            document.getElementById('azimuth-value').textContent = 
                ((status.azimuth + 360) % 360).toFixed(0) + '°';
            document.getElementById('polar-value').textContent = 
                (90 - (status.polar - 90)).toFixed(0) + '°';
            
            const hasChanged = status.distance !== CONFIG.INITIAL_DISTANCE || 
                              controls.target.length() > 0.01 ||
                              Math.abs(colorState.hue - 0.44) > 0.01;
            document.getElementById('reset-btn').classList.toggle('visible', hasChanged);
        }

        // ============================================
        // 事件处理
        // ============================================
        document.addEventListener('dblclick', () => {
            controls.reset();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            controls.reset();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // 动画循环
        // ============================================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);

            time += 0.016;

            controls.update();

            // 更新所有shader的时间
            sphereMaterial.uniforms.time.value = time;
            outerGlowMaterial.uniforms.time.value = time;
            particleMaterial.uniforms.time.value = time;

            // 球体自转
            sphere.rotation.y = time * 0.1;
            sphere.rotation.x = Math.sin(time * 0.2) * 0.1;

            // 粒子动画
            particles.rotation.y = time * 0.05;
            particles.rotation.x = time * 0.03;

            // 灯光动画
            pointLight1.position.x = Math.sin(time * 0.5) * 3;
            pointLight1.position.z = Math.cos(time * 0.5) * 3;
            pointLight2.position.x = Math.cos(time * 0.3) * 3;
            pointLight2.position.z = Math.sin(time * 0.3) * 3;

            if (Math.floor(time * 60) % 5 === 0) {
                updateStatus();
            }

            composer.render();
        }

        animate();
    </script>
</body>
</html>
