<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 50%, #000000 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        canvas.dragging {
            cursor: grabbing;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #info .key {
            color: #00ff88;
            font-weight: bold;
        }

        #status-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 180px;
        }

        #status-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #00ff88;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        #status-panel .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        #status-panel .stat-label {
            color: rgba(255, 255, 255, 0.6);
        }

        #status-panel .stat-value {
            color: #00ff88;
            font-family: monospace;
        }

        #status-panel .color-preview {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #color-indicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #color-indicator.show {
            opacity: 1;
        }

        #color-indicator .color-wheel {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 20px currentColor;
        }

        #color-indicator .color-label {
            color: white;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info">
        <span class="key">鼠标移动</span> 旋转 | 
        <span class="key">滚轮</span> 改变颜色 | 
        <span class="key">右键拖拽</span> 移动 | 
        <span class="key">双击</span> 重置
    </div>

    <div id="status-panel">
        <h3>🎮 状态面板</h3>
        <div class="stat-row">
            <span class="stat-label">颜色:</span>
            <span class="stat-value" id="color-value">#00FF88<span class="color-preview" style="background: #00ff88;"></span></span>
        </div>
        <div class="stat-row">
            <span class="stat-label">位置:</span>
            <span class="stat-value" id="position-value">X: 0.00, Y: 0.00</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">缩放:</span>
            <span class="stat-value" id="scale-value">1.00x</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">旋转:</span>
            <span class="stat-value" id="rotation-value">Auto</span>
        </div>
    </div>

    <div id="color-indicator">
        <div class="color-wheel" id="color-wheel"></div>
        <span class="color-label" id="color-label">Color Changed</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ============================================
        // 配置常量
        // ============================================
        const CONFIG = {
            INITIAL_COLOR: 0x00ff88,
            COLOR_SENSITIVITY: 0.002,  // 滚轮颜色变化灵敏度
            MOVE_SENSITIVITY: 0.01,    // 右键移动灵敏度
            ZOOM_SENSITIVITY: 0.1,     // 缩放灵敏度
            ROTATION_SPEED: 0.15,      // 自动旋转速度
            LERP_FACTOR: 0.05          // 平滑插值因子
        };

        // ============================================
        // 场景初始化
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // 渲染器
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        // 后处理
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.85
        );
        composer.addPass(bloomPass);

        // ============================================
        // 状态管理
        // ============================================
        const state = {
            hue: 0.44,           // 当前色相 (0-1, 0.44 ≈ 青色/绿色)
            saturation: 1.0,     // 饱和度
            lightness: 0.5,      // 亮度
            position: { x: 0, y: 0 },
            targetPosition: { x: 0, y: 0 },
            scale: 1.0,
            targetScale: 1.0,
            rotation: { x: 0, y: 0 },
            targetRotation: { x: 0, y: 0 },
            isDragging: false,
            isRightDragging: false,
            lastMousePos: { x: 0, y: 0 },
            autoRotate: true
        };

        // ============================================
        // 颜色工具函数
        // ============================================
        function hslToHex(h, s, l) {
            const color = new THREE.Color();
            color.setHSL(h, s, l);
            return color;
        }

        function getColorHexString(color) {
            const r = Math.round(color.r * 255).toString(16).padStart(2, '0');
            const g = Math.round(color.g * 255).toString(16).padStart(2, '0');
            const b = Math.round(color.b * 255).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`.toUpperCase();
        }

        function updateColorIndicator(color) {
            const indicator = document.getElementById('color-indicator');
            const wheel = document.getElementById('color-wheel');
            const hex = getColorHexString(color);
            
            wheel.style.backgroundColor = hex;
            wheel.style.color = hex;
            document.getElementById('color-label').textContent = hex;
            
            indicator.classList.add('show');
            setTimeout(() => indicator.classList.remove('show'), 1500);
        }

        function updateStatusPanel() {
            const currentColor = hslToHex(state.hue, state.saturation, state.lightness);
            const hexString = getColorHexString(currentColor);
            
            document.getElementById('color-value').innerHTML = 
                `${hexString}<span class="color-preview" style="background: ${hexString.toLowerCase()};"></span>`;
            document.getElementById('position-value').textContent = 
                `X: ${state.position.x.toFixed(2)}, Y: ${state.position.y.toFixed(2)}`;
            document.getElementById('scale-value').textContent = 
                `${state.scale.toFixed(2)}x`;
            document.getElementById('rotation-value').textContent = 
                state.autoRotate ? 'Auto' : 'Manual';
        }

        // ============================================
        // 创建球体
        // ============================================
        const sphereGroup = new THREE.Group();
        scene.add(sphereGroup);

        // 主球体
        const sphereGeometry = new THREE.SphereGeometry(1.5, 64, 64);
        const sphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: hslToHex(state.hue, state.saturation, state.lightness) },
                glowIntensity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUv;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                uniform float glowIntensity;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUv;

                void main() {
                    float noise = sin(vPosition.x * 10.0 + time) * 
                                  cos(vPosition.y * 10.0 + time * 0.7) * 
                                  sin(vPosition.z * 10.0 + time * 0.5);
                    
                    vec3 viewDirection = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDirection, vNormal)), 2.0);
                    
                    vec3 baseColor = glowColor + vec3(0.1, 0.2, 0.3) * sin(time * 0.5);
                    
                    float alpha = 0.3 + fresnel * 0.7 + noise * 0.1;
                    vec3 finalColor = baseColor * glowIntensity * (1.0 + fresnel * 0.5);
                    
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphereGroup.add(sphere);

        // 内核球体
        const coreGeometry = new THREE.SphereGeometry(1.3, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: CONFIG.INITIAL_COLOR,
            transparent: true,
            opacity: 0.6
        });
        const coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        sphere.add(coreSphere);

        // 外发光层
        const outerGlowGeometry = new THREE.SphereGeometry(1.8, 32, 32);
        const outerGlowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: hslToHex(state.hue, state.saturation, state.lightness) }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                varying vec3 vNormal;

                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 glow = glowColor * intensity * (0.5 + 0.5 * sin(time));
                    gl_FragColor = vec4(glow, intensity * 0.5);
                }
            `,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const outerGlowSphere = new THREE.Mesh(outerGlowGeometry, outerGlowMaterial);
        sphere.add(outerGlowSphere);

        // 粒子系统
        const particleCount = 200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const radius = 3 + Math.random() * 2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i * 3 + 2] = radius * Math.cos(phi);

            particleSizes[i] = Math.random() * 2 + 0.5;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: hslToHex(state.hue, state.saturation, state.lightness) }
            },
            vertexShader: `
                attribute float size;
                uniform float time;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;
                    pos.x += sin(time * 0.5 + position.y) * 0.1;
                    pos.y += cos(time * 0.3 + position.x) * 0.1;
                    pos.z += sin(time * 0.7 + position.z) * 0.1;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = 0.5 + 0.5 * sin(time + position.x);
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vAlpha;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;

                    float alpha = (1.0 - dist * 2.0) * vAlpha;
                    gl_FragColor = vec4(color, alpha * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        sphereGroup.add(particles);

        // 灯光
        const pointLight1 = new THREE.PointLight(CONFIG.INITIAL_COLOR, 2, 10);
        pointLight1.position.set(2, 2, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x0088ff, 1, 10);
        pointLight2.position.set(-2, -2, 2);
        scene.add(pointLight2);

        const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
        scene.add(ambientLight);

        // ============================================
        // 更新颜色的统一函数
        // ============================================
        function updateAllColors() {
            const newColor = hslToHex(state.hue, state.saturation, state.lightness);
            
            // 更新所有材质的颜色
            sphereMaterial.uniforms.glowColor.value = newColor;
            outerGlowMaterial.uniforms.glowColor.value = newColor;
            particleMaterial.uniforms.color.value = newColor;
            coreMaterial.color = newColor;
            pointLight1.color = newColor;
            
            updateStatusPanel();
        }

        // ============================================
        // 事件处理
        // ============================================
        
        // 阻止右键菜单
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // 鼠标移动 - 旋转或右键拖拽移动
        document.addEventListener('mousemove', (event) => {
            if (state.isRightDragging) {
                // 右键拖拽：移动球体
                const deltaX = event.clientX - state.lastMousePos.x;
                const deltaY = event.clientY - state.lastMousePos.y;
                
                state.targetPosition.x += deltaX * CONFIG.MOVE_SENSITIVITY;
                state.targetPosition.y -= deltaY * CONFIG.MOVE_SENSITIVITY;
                
                state.lastMousePos.x = event.clientX;
                state.lastMousePos.y = event.clientY;
            } else if (!state.isDragging) {
                // 普通移动：控制旋转
                const mouseX = (event.clientX - window.innerWidth / 2) / window.innerWidth;
                const mouseY = (event.clientY - window.innerHeight / 2) / window.innerHeight;
                
                state.targetRotation.y = mouseX * Math.PI;
                state.targetRotation.x = -mouseY * Math.PI;
            }
        });

        // 鼠标按下
        document.addEventListener('mousedown', (event) => {
            if (event.button === 2) { // 右键
                state.isRightDragging = true;
                state.lastMousePos.x = event.clientX;
                state.lastMousePos.y = event.clientY;
                container.querySelector('canvas').classList.add('dragging');
            }
        });

        // 鼠标释放
        document.addEventListener('mouseup', () => {
            state.isRightDragging = false;
            state.isDragging = false;
            container.querySelector('canvas').classList.remove('dragging');
        });

        // 滚轮 - 改变颜色（色相循环）
        document.addEventListener('wheel', (event) => {
            event.preventDefault();
            
            // 根据滚轮方向改变色相
            state.hue += event.deltaY * CONFIG.COLOR_SENSITIVITY;
            
            // 色相循环 (0-1)
            state.hue = state.hue % 1;
            if (state.hue < 0) state.hue += 1;
            
            updateAllColors();
            updateColorIndicator(hslToHex(state.hue, state.saturation, state.lightness));
        }, { passive: false });

        // 双击重置
        document.addEventListener('dblclick', () => {
            state.hue = 0.44;
            state.targetPosition = { x: 0, y: 0 };
            state.targetScale = 1.0;
            state.targetRotation = { x: 0, y: 0 };
            state.autoRotate = true;
            camera.position.z = 5;
            
            updateAllColors();
            updateColorIndicator(hslToHex(state.hue, state.saturation, state.lightness));
        });

        // 触摸支持
        let touchStartPos = { x: 0, y: 0 };
        
        document.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                touchStartPos.x = event.touches[0].clientX;
                touchStartPos.y = event.touches[0].clientY;
            }
        });

        document.addEventListener('touchmove', (event) => {
            if (event.touches.length === 1) {
                event.preventDefault();
                const touch = event.touches[0];
                const mouseX = (touch.clientX - window.innerWidth / 2) / window.innerWidth;
                const mouseY = (touch.clientY - window.innerHeight / 2) / window.innerHeight;
                
                state.targetRotation.y = mouseX * Math.PI;
                state.targetRotation.x = -mouseY * Math.PI;
            }
        }, { passive: false });

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // 动画循环
        // ============================================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);

            time += 0.016;

            // 平滑插值
            state.rotation.x += (state.targetRotation.x - state.rotation.x) * CONFIG.LERP_FACTOR;
            state.rotation.y += (state.targetRotation.y - state.rotation.y) * CONFIG.LERP_FACTOR;
            state.position.x += (state.targetPosition.x - state.position.x) * CONFIG.LERP_FACTOR;
            state.position.y += (state.targetPosition.y - state.position.y) * CONFIG.LERP_FACTOR;
            state.scale += (state.targetScale - state.scale) * CONFIG.LERP_FACTOR;

            // 应用变换
            sphereGroup.position.x = state.position.x;
            sphereGroup.position.y = state.position.y;
            sphereGroup.scale.setScalar(state.scale);

            // 旋转（自动 + 鼠标控制）
            if (state.autoRotate) {
                sphere.rotation.x = state.rotation.x + time * 0.1;
                sphere.rotation.y = state.rotation.y + time * CONFIG.ROTATION_SPEED;
            } else {
                sphere.rotation.x = state.rotation.x;
                sphere.rotation.y = state.rotation.y;
            }

            // 更新 shader uniforms
            sphereMaterial.uniforms.time.value = time;
            outerGlowMaterial.uniforms.time.value = time;
            particleMaterial.uniforms.time.value = time;

            // 粒子动画
            particles.rotation.y = time * 0.05;
            particles.rotation.x = time * 0.03;

            // 灯光动画
            pointLight1.position.x = Math.sin(time * 0.5) * 3 + state.position.x;
            pointLight1.position.z = Math.cos(time * 0.5) * 3;
            pointLight2.position.x = Math.cos(time * 0.3) * 3 + state.position.x;
            pointLight2.position.z = Math.sin(time * 0.3) * 3;

            // 每 10 帧更新一次状态面板（优化性能）
            if (Math.floor(time * 60) % 10 === 0) {
                updateStatusPanel();
            }

            composer.render();
        }

        // 初始化状态面板
        updateStatusPanel();
        animate();
    </script>
</body>
</html>
