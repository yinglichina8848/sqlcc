name: Include Path Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/include_path_manager.py'

jobs:
  include-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 如果有requirements.txt，安装依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Include Path Analysis
      run: |
        echo "🔍 Running include path analysis..."
        python tools/include_path_manager.py --analyze --output include_check_report.json

    - name: Check for Critical Issues
      id: check_issues
      run: |
        if [ -f include_check_report.json ]; then
          # 检查是否有严重问题
          critical_count=$(python -c "
          import json
          with open('include_check_report.json') as f:
              data = json.load(f)
          summary = data.get('summary', {})
          severity = summary.get('severity_breakdown', {})
          critical = severity.get('high', 0) + severity.get('medium', 0)
          print(critical)
          ")

          echo "critical_issues=$critical_count" >> $GITHUB_OUTPUT

          if [ "$critical_count" -gt 0 ]; then
            echo "⚠️ Found $critical_count critical include issues"
            echo "issues_found=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No critical include issues found"
            echo "issues_found=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ Include check report not generated"
          echo "critical_issues=0" >> $GITHUB_OUTPUT
          echo "issues_found=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate Include Fix Script
      if: steps.check_issues.outputs.issues_found == 'true'
      run: |
        echo "🔧 Generating include fix script..."
        python tools/include_path_manager.py --fix-script

    - name: Upload analysis results
      uses: actions/upload-artifact@v3
      with:
        name: include-analysis-results
        path: |
          include_check_report.json
          fix_include_paths.sh

    - name: Comment on PR with results
      if: github.event_name == 'pull_request' && steps.check_issues.outputs.issues_found == 'true'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'include_check_report.json';

          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const summary = report.summary || {};

            const comment = `
## 🔍 Include Path Analysis Results

### 📊 Summary
- **Files analyzed**: ${summary.total_files || 0}
- **Issues found**: ${summary.total_issues || 0}
- **Severity breakdown**:
  - High: ${summary.severity_breakdown?.high || 0}
  - Medium: ${summary.severity_breakdown?.medium || 0}
  - Low: ${summary.severity_breakdown?.low || 0}

### 📋 Details
${Object.entries(report.analysis_results || {}).slice(0, 5).map(([file, issues]) =>
  `**${file}**: ${issues.length} issue(s)`
).join('\n')}

${summary.total_issues > 5 ? `\n... and ${summary.total_issues - 5} more issues` : ''}

### 🔧 Next Steps
1. Review the detailed report in the artifacts
2. Run the generated fix script: \`./fix_include_paths.sh\`
3. Commit the fixes and push again

---
*This check ensures consistent include path usage across the codebase.*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Fail on Critical Issues
      if: steps.check_issues.outputs.issues_found == 'true'
      run: |
        echo "❌ Found critical include path issues. Please fix them before merging."
        echo "Run 'python tools/include_path_manager.py --fix-script' to generate a fix script."
        exit 1

  dependency-check:
    runs-on: ubuntu-latest
    needs: include-check

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Run Dependency Analysis
      run: |
        echo "🔗 Running dependency analysis..."
        python tools/include_path_manager.py --dependencies --output dependency_report.json

    - name: Check for Cycles
      run: |
        if [ -f dependency_report.json ]; then
          cycles_count=$(python -c "
          import json
          with open('dependency_report.json') as f:
              data = json.load(f)
          cycles = data.get('cycles', [])
          print(len(cycles))
          ")

          if [ "$cycles_count" -gt 0 ]; then
            echo "⚠️ Found $cycles_count circular dependencies"
            echo "Please review dependency_report.json for details"

            # 对于PR，添加注释
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "Circular dependencies detected. This may cause build issues."
            fi
          else
            echo "✅ No circular dependencies found"
          fi
        fi

    - name: Upload dependency results
      uses: actions/upload-artifact@v3
      with:
        name: dependency-analysis-results
        path: dependency_report.json
