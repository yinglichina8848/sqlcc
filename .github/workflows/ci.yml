name: SQLCC CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-coverage:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest
    env:
      BAZEL_VERSION: 8.5.0
      LLVM_VERSION: 20.1.8
      COVERAGE_DIR: coverage_html
      PROFRAW_FILE: coverage.profraw

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 安装依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang-${{ env.LLVM_VERSION }} lld llvm-${{ env.LLVM_VERSION }}-dev \
            libx11-dev libgtk-3-dev libnss3-dev libxss1 libasound2
          # 安装 Bazel
          sudo apt install -y apt-transport-https curl gnupg -y
          curl -fsSL https://bazel.build/bazel-release.pub.gpg | gpg --dearmor > bazel-archive-keyring.gpg
          sudo mv bazel-archive-keyring.gpg /usr/share/keyrings/
          echo "deb [signed-by=/usr/share/keyrings/bazel-archive-keyring.gpg] https://storage.googleapis.com/bazel-apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list
          sudo apt update && sudo apt install -y bazel-${{ env.BAZEL_VERSION }}

      # 3. Bazel 缓存加速（可选）
      - name: Cache Bazel
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/bazel
            bazel-out/
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/WORKSPACE') }}

      # 4. 构建核心模块
      - name: Build Core Modules
        run: |
          bazel build //src/exception:io_exception
          bazel build //src/logger:logger
          bazel build //src/core:core

      # 5. 执行所有单元测试
      - name: Run Unit Tests
        run: |
          bazel test //tests/... --test_output=errors

      # 6. 生成覆盖率报告
      - name: Generate LLVM Coverage HTML Report
        run: |
          chmod +x scripts/generate_llvm_cov_html_report.sh
          bash scripts/generate_llvm_cov_html_report.sh //tests/... ${{ env.COVERAGE_DIR }}

      # 7. 上传覆盖率报告
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: sqlcc-coverage-report
          path: ${{ env.COVERAGE_DIR }}
