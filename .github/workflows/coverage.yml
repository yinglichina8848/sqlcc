name: Coverage Analysis Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build before running tests'
        required: false
        default: 'false'
        type: boolean
      skip_coverage:
        description: 'Skip coverage analysis'
        required: false
        default: 'false'
        type: boolean
      skip_quality_gate:
        description: 'Skip quality gate checks'
        required: false
        default: 'false'
        type: boolean

env:
  BAZEL_CACHE_DIR: ~/.cache/bazel

jobs:
  coverage-analysis:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          clang-18 \
          clang++-18 \
          lcov \
          python3 \
          python3-pip \
          git \
          curl \
          wget \
          bc \
          jq

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        # 这里可以安装项目特定的Python依赖

    - name: Set up Bazel
      run: |
        # 下载并安装Bazel
        BAZEL_VERSION=6.5.0
        wget -q https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-installer-linux-x86_64.sh
        chmod +x bazel-${BAZEL_VERSION}-installer-linux-x86_64.sh
        ./bazel-${BAZEL_VERSION}-installer-linux-x86_64.sh --user
        export PATH="$PATH:$HOME/bin"
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure Bazel
      run: |
        # 创建.bazelrc配置
        cat > .bazelrc << EOF
        build --cxxopt=-std=c++20
        build --cxxopt=-stdlib=libc++
        build --linkopt=-stdlib=libc++
        build --linkopt=-lc++abi
        build --copt=-Wno-error=maybe-uninitialized
        build --spawn_strategy=standalone
        build --verbose_failures
        test --test_output=errors
        test --test_timeout=300
        coverage --combined_report=lcov
        coverage --instrumentation_filter="//src/.*"
        EOF

    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: ~/.cache/bazel
        key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '**/*.bzl') }}
        restore-keys: |
          bazel-${{ runner.os }}-

    - name: Verify scripts are executable
      run: |
        chmod +x scripts/coverage_pipeline.sh
        ls -la scripts/coverage_pipeline.sh

    - name: Run coverage pipeline
      run: |
        export PATH="$PATH:$HOME/bin"
        ./scripts/coverage_pipeline.sh \
          ${{ inputs.clean_build == 'true' && '--clean' || '' }} \
          ${{ inputs.skip_coverage == 'true' && '--no-coverage' || '' }} \
          ${{ inputs.skip_quality_gate == 'true' && '--no-quality-gate' || '' }}

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          coverage_report/
          test_reports/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          test_results/
          bazel-testlogs/
        retention-days: 7

    - name: Generate coverage badge
      run: |
        # 如果有覆盖率数据，生成badge
        if [ -f "coverage_report/coverage_report.json" ]; then
          COVERAGE=$(jq -r '.coverage_percentage // 0' coverage_report/coverage_report.json)
          echo "coverage=${COVERAGE}%" >> $GITHUB_ENV
          echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
        fi

    - name: Comment PR with coverage results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // 读取测试摘要报告
          let summaryText = '## 🧪 Test Coverage Report\n\n';
          const summaryFile = 'test_reports/test_summary_*.txt';

          try {
            const files = fs.readdirSync('test_reports');
            const summaryFiles = files.filter(f => f.startsWith('test_summary_'));
            if (summaryFiles.length > 0) {
              const latestSummary = summaryFiles.sort().pop();
              const content = fs.readFileSync(path.join('test_reports', latestSummary), 'utf8');
              summaryText += content;
            }
          } catch (error) {
            summaryText += '❌ 无法读取测试摘要报告\n';
          }

          // 添加覆盖率信息
          if (process.env.COVERAGE_PERCENTAGE) {
            const coverage = parseFloat(process.env.COVERAGE_PERCENTAGE);
            const badge = coverage >= 80 ? '🟢' : coverage >= 60 ? '🟡' : '🔴';
            summaryText += `\n### 📊 Coverage: ${badge} ${coverage}%\n`;
          }

          // 添加报告链接
          summaryText += '\n### 📁 Reports\n';
          summaryText += '- [Coverage HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)\n';
          summaryText += '- [Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)\n';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summaryText
          });

    - name: Quality Gate Check
      run: |
        # 检查是否有失败的测试
        if find test_reports -name "*.txt" -exec grep -l "失败\|failed\|FAILED" {} \; | grep -q .; then
          echo "❌ Quality Gate Failed: Tests are failing"
          exit 1
        fi

        # 检查覆盖率是否达标
        if [ -f "coverage_report/coverage_report.json" ]; then
          COVERAGE=$(jq -r '.coverage_percentage // 0' coverage_report/coverage_report.json)
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "❌ Quality Gate Failed: Coverage ${COVERAGE}% below 80%"
            exit 1
          fi
        fi

        echo "✅ Quality Gate Passed"

  # 定时覆盖率趋势分析
  coverage-trends:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Analyze coverage trends
      run: |
