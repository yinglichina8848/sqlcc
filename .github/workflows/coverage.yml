        echo "Coverage trends analysis completed"

  # 依赖关系检查
  dependency-check:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y python3 python3-pip graphviz

    - name: Check build dependencies
      run: |
