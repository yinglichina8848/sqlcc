name: SQLCC CI/CD Pipeline

on:
  push:
    branches: [ main, develop, v1.3.* ]
  pull_request:
    branches: [ main, develop ]

env:
  BAZEL_VERSION: 8.5
  CLANG_VERSION: 20

jobs:
  # 代码质量检查
  code_quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazel-version: ${{ env.BAZEL_VERSION }}

    - name: Setup clang-20
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-20 main"
        sudo apt-get update
        sudo apt-get install -y clang-20 clang-tidy-20

    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel-${{ hashFiles('WORKSPACE', 'MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-

    - name: Run clang-tidy
      run: |
        find src include tests -name "*.cpp" -o -name "*.h" | \
        xargs -I {} clang-tidy-20 {} -- \
          -std=c++20 \
          -Iinclude \
          -Isrc \
          --system-header-prefix=external/ \
          -Wno-unused-parameter \
          -Wno-missing-braces || true

    - name: Check code formatting
      run: |
        sudo apt-get install -y clang-format-20
        find src include tests -name "*.cpp" -o -name "*.h" | \
        xargs clang-format-20 --dry-run --Werror --style=file || true

  # 构建和单元测试
  build_and_test:
    runs-on: ubuntu-latest
    needs: code_quality
    strategy:
      matrix:
        build_type: [fastbuild, opt]
        test_suite: [unit, integration]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazel-version: ${{ env.BAZEL_VERSION }}

    - name: Setup clang-20
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-20 main"
        sudo apt-get update
        sudo apt-get install -y clang-20 lld-20

    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel-${{ matrix.build_type }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-${{ matrix.build_type }}-

    - name: Build project
      run: |
        bazel build \
          --config=clang20 \
          --compilation_mode=${{ matrix.build_type }} \
          //...

    - name: Run unit tests
      if: matrix.test_suite == 'unit'
      run: |
        bazel test \
          --config=clang20 \
          --compilation_mode=${{ matrix.build_type }} \
          --test_output=errors \
          //tests/unit/...

    - name: Run integration tests
      if: matrix.test_suite == 'integration'
      run: |
        bazel test \
          --config=clang20 \
          --compilation_mode=${{ matrix.build_type }} \
          --test_output=errors \
          //tests/integration/...

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.build_type }}-${{ matrix.test_suite }}
        path: bazel-testlogs/

  # 性能测试
  performance_test:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazel-version: ${{ env.BAZEL_VERSION }}

    - name: Setup clang-20
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-20 main"
        sudo apt-get update
        sudo apt-get install -y clang-20 lld-20

    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel-perf-${{ hashFiles('WORKSPACE', 'MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-perf-

    - name: Load performance baselines
      run: |
        # 从缓存或artifact加载基准线数据
        if [ -f performance_baselines.csv ]; then
          cp performance_baselines.csv /tmp/
        fi

    - name: Run performance tests
      run: |
        ./scripts/run_performance_tests.sh \
          --scale MEDIUM \
          --iterations 3 \
          --with-baseline

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: |
          performance_results/
          performance_reports/

    - name: Check performance regressions
      run: |
        # 检查是否有严重的性能回归
        if [ -f performance_reports/performance_regressions.txt ]; then
          if grep -q "critical\|high" performance_reports/performance_regressions.txt; then
            echo "发现严重的性能回归！"
            cat performance_reports/performance_regressions.txt
            exit 1
          fi
        fi

  # 覆盖率测试
  coverage:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazel-version: ${{ env.BAZEL_VERSION }}

    - name: Setup clang-20 with coverage
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-20 main"
        sudo apt-get update
        sudo apt-get install -y clang-20 lld-20 lcov

    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel-coverage-${{ hashFiles('WORKSPACE', 'MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-coverage-

    - name: Run unit test coverage
      run: |
        # 运行单元测试覆盖率套件
        bazel test \
          --config=clang20 \
          --test_output=errors \
          --test_tag_filters=coverage \
          //tests/unit:unit_tests_coverage

    - name: Run integration test coverage
      run: |
        # 运行集成测试覆盖率套件
        bazel test \
          --config=clang20 \
          --test_output=errors \
          --test_tag_filters=coverage \
          //tests/integration:integration_test_coverage

    - name: Run performance test coverage
      run: |
        # 运行性能测试覆盖率版本
        bazel test \
          --config=clang20 \
          --test_output=errors \
          --test_tag_filters=coverage \
          //tests/performance:crud_performance_test_with_coverage

    - name: Generate coverage report
      run: |
        # 合并所有覆盖率数据
        mkdir -p coverage_data

        # 查找所有覆盖率文件
        find bazel-bin -name "*.profraw" -exec llvm-profdata merge {} -o coverage_data/merged.profdata \;

        # 生成覆盖率报告
        llvm-cov export \
          --format=lcov \
          --instr-profile=coverage_data/merged.profdata \
          bazel-bin/tests/unit/b_plus_tree_test_coverage \
          bazel-bin/tests/unit/buffer_pool_test_coverage \
          bazel-bin/tests/unit/disk_manager_test_coverage \
          bazel-bin/tests/unit/index_maintenance_test_coverage \
          bazel-bin/tests/unit/basic_bplus_tree_test_coverage \
          bazel-bin/tests/unit/logger_test_coverage \
          bazel-bin/tests/unit/simple_create_test_coverage \
          bazel-bin/tests/integration/ddl_commands_test_coverage \
          bazel-bin/tests/integration/dml_commands_test_coverage \
          bazel-bin/tests/integration/error_handling_test_coverage \
          bazel-bin/tests/integration/procedure_split_test_coverage \
          bazel-bin/tests/integration/trigger_split_test_coverage \
          bazel-bin/tests/performance/crud_performance_test_with_coverage \
          > coverage_data/coverage.lcov

        # 生成HTML报告
        genhtml coverage_data/coverage.lcov \
          --output-directory coverage_report \
          --title "SQLCC Coverage Report" \
          --legend \
          --show-details

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage_data/coverage.lcov
        flags: unittests
        name: codecov-umbrella

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage_report/

    - name: Upload coverage data
      uses: actions/upload-artifact@v3
      with:
        name: coverage-data
        path: |
          coverage_data/
          bazel-bin/**/*.profraw

  # 安全测试
  security_test:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazel-version: ${{ env.BAZEL_VERSION }}

    - name: Setup clang-20
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-20 main"
        sudo apt-get update
        sudo apt-get install -y clang-20 lld-20

    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: ~/.cache/bazel
        key: ${{ runner.os }}-bazel-security-${{ hashFiles('WORKSPACE', 'MODULE.bazel') }}
        restore-keys: |
          ${{ runner.os }}-bazel-security-

    - name: Build security tests
      run: |
        bazel build //tests/integration:security_test

    - name: Run security tests
      run: |
        bazel test //tests/integration:security_test

    - name: Run static security analysis
      run: |
        # 使用Clang Static Analyzer
        find src -name "*.cpp" | \
        xargs -I {} clang-20 --analyze {} \
          -std=c++20 \
          -Iinclude \
          -Isrc \
          -Xanalyzer -analyzer-output=text || true

  # 部署准备
  deploy_prepare:
    runs-on: ubuntu-latest
    needs: [build_and_test, performance_test, coverage, security_test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazel-version: ${{ env.BAZEL_VERSION }}

    - name: Build release binaries
      run: |
        bazel build \
          --config=clang20 \
          --compilation_mode=opt \
          --strip=always \
          //src:sqlcc_server

    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp bazel-bin/src/sqlcc_server deployment/
        cp -r include deployment/
        cp LICENSE deployment/
        cp README.md deployment/

        # 创建部署包
        tar -czf sqlcc-deployment-$(date +%Y%m%d-%H%M%S).tar.gz deployment/

    - name: Upload deployment package
      uses: actions/upload-artifact@v3
      with:
        name: sqlcc-deployment
        path: sqlcc-deployment-*.tar.gz

  # 通知和监控
  notify:
    runs-on: ubuntu-latest
    needs: [code_quality, build_and_test, performance_test, coverage, security_test, deploy_prepare]
    if: always()

    steps:
    - name: Generate test summary
      run: |
        echo "## CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

        # 检查各个job的状态
        jobs=("code_quality" "build_and_test" "performance_test" "coverage" "security_test" "deploy_prepare")
        for job in "${jobs[@]}"; do
          if [ "${{ needs.${job}.result }}" == "success" ]; then
            status="✅ Passed"
          elif [ "${{ needs.${job}.result }}" == "skipped" ]; then
            status="⏭️ Skipped"
          else
            status="❌ Failed"
          fi
          echo "| ${job} | ${status} |" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Bazel Version: ${{ env.BAZEL_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- Clang Version: ${{ env.CLANG_VERSION }}" >> $GITHUB_STEP_SUMMARY

    - name: Send notifications
      if: failure()
      run: |
        # 这里可以集成Slack、邮件或其他通知服务
        echo "CI/CD pipeline failed - notifications would be sent here"
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"SQLCC CI/CD Pipeline Failed","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"CI/CD pipeline failed for commit ${{ github.sha }}"}}]}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}