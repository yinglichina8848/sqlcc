# SQLCC 内存安全定期审计配置
# 此文件用于配置cron定时任务，定期执行内存安全审计

# 每日凌晨2点执行完整审计
0 2 * * * /home/liying/sqlcc/scripts/memory_safety_audit.sh >> /var/log/sqlcc_memory_audit.log 2>&1

# 每周日凌晨3点执行深度审计（包含Valgrind检测）
0 3 * * 0 /home/liying/sqlcc/scripts/memory_safety_audit.sh --deep >> /var/log/sqlcc_memory_deep_audit.log 2>&1

# 每月1日凌晨4点生成月度审计报告
0 4 1 * * /home/liying/sqlcc/scripts/memory_safety_audit.sh --monthly-report >> /var/log/sqlcc_memory_monthly.log 2>&1

# 工作时间内每小时执行快速检查（周一至周五，9-18点）
0 9-18 * * 1-5 /home/liying/sqlcc/scripts/quick_memory_check.sh >> /var/log/sqlcc_memory_quick.log 2>&1